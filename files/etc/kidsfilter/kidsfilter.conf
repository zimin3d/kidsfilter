# Настройки kidsfilter (после изменения: /etc/init.d/kidsfilter restart)

# LAN-интерфейсы (мосты), к которым подключены детские устройства, через пробел.
# Установщик подставляет LAN роутера; гостевую сеть можно добавить: LAN_IF="br-lan br-guest"
LAN_IF=br-lan

# Порт отдельного DNS-сервера для детей (не 53 и не 5353 — он занят mDNS)
DNS_PORT=5300

# Порт веб-сервера страницы «Сайт закрыт» (слушает только на LAN). Включить/выключить: kidsctl blockpage on|off
BLOCK_PORT=5380

# Сколько дней хранить статистику
KEEP_DAYS=30

# Предел статистики в RAM, КБ (по умолчанию 1/32 памяти роутера, не больше 8192).
# При превышении удаляются самые старые дни.
#STATS_MAX_KB=2048

# Журнал запросов разбирается досрочно, если вырос больше этого размера, КБ
LOG_MAX_KB=2048

# Копия статистики на флеше (раз в сутки): не больше SAVE_MAX_KB, и на флеше всегда остаётся
# свободным SAVE_RESERVE_KB. Если места мало — сохраняются только последние дни.
#SAVE_MAX_KB=1024
#SAVE_RESERVE_KB=512

# Разрешённых адресов (allow4 + allow6) больше этого числа — ночью наборы очищаются
# и заполняются заново по DNS (сайты на CDN постоянно получают новые адреса).
#ALLOW_MAX=20000

# Не больше стольких DNS-запросов в секунду с одного детского устройства (защита от программы,
# которая шлёт запросы в цикле и иначе быстро заполнила бы журнал в памяти)
#DNS_RATE=100
